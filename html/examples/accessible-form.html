<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible Form Example</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 480px; margin: 2rem auto; padding: 0 1rem; }

    /* Visible, clear focus outline — NEVER remove this without a good replacement.
       Removing focus outlines is one of the most common accessibility mistakes. */
    :focus-visible {
      outline: 3px solid #2b6cb0;
      outline-offset: 2px;
    }

    fieldset { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 1rem; padding: 1rem; }
    legend { font-weight: bold; padding: 0 0.25rem; }

    label { display: block; font-weight: 600; margin-top: 0.75rem; }
    input, select { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #999; border-radius: 4px; }

    /* Style native validity state feedback */
    input:invalid { border-color: #c53030; }
    input:valid { border-color: #2f855a; }

    .hint { font-size: 0.85rem; color: #555; margin-top: 0.25rem; }

    /* Error text — hidden by default, shown by JS when a field fails validation */
    .error-text {
      color: #c53030;
      font-size: 0.85rem;
      margin-top: 0.25rem;
      display: none;
    }
    .error-text.visible { display: block; }

    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #245a91; }

    /* Visually-hidden but still announced by screen readers */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>Create Account</h1>

  <!--
    novalidate: we still keep native validation ATTRIBUTES (required, pattern, etc.)
    so we can query them via the Constraint Validation API in JS, but we suppress the
    browser's default validation tooltip UI so we can render our own styled,
    accessible error messages instead.
  -->
  <form id="signupForm" novalidate>

    <!-- fieldset + legend group related fields for screen reader users -->
    <fieldset>
      <legend>Account Details</legend>

      <!--
        Real <label> linked via for/id — NOT a placeholder.
        Placeholders disappear on input and are not a reliable accessible name.
      -->
      <label for="fullName">Full name</label>
      <input
        id="fullName"
        name="fullName"
        type="text"
        required
        minlength="2"
        aria-describedby="fullNameError"
      />
      <span id="fullNameError" class="error-text" role="alert"></span>

      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        aria-describedby="emailHint emailError"
      />
      <span id="emailHint" class="hint">We'll never share your email with anyone.</span>
      <span id="emailError" class="error-text" role="alert"></span>

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="8"
        pattern="(?=.*[0-9])(?=.*[A-Za-z]).{8,}"
        aria-describedby="passwordHint passwordError"
      />
      <span id="passwordHint" class="hint">At least 8 characters, with letters and numbers.</span>
      <span id="passwordError" class="error-text" role="alert"></span>
    </fieldset>

    <fieldset>
      <legend>Notification preference</legend>
      <!--
        Radio buttons share the same "name" so only one can be selected.
        Each has its own <label> for/id pairing.
      -->
      <input type="radio" id="notifyEmail" name="notify" value="email" checked />
      <label for="notifyEmail" style="display:inline; font-weight:normal;">Email me updates</label>
      <br />
      <input type="radio" id="notifySms" name="notify" value="sms" />
      <label for="notifySms" style="display:inline; font-weight:normal;">Text me updates</label>
    </fieldset>

    <button type="submit">Create account</button>

    <!--
      aria-live="polite": a screen reader will announce whatever text appears
      here WITHOUT stealing keyboard focus — perfect for a "form submitted!"
      style status message.
    -->
    <p id="formStatus" aria-live="polite" class="sr-only"></p>
  </form>

  <script>
    const form = document.getElementById('signupForm');
    const statusEl = document.getElementById('formStatus');

    // Map each field name to its error element and a friendly message
    const fieldConfig = {
      fullName: { errorEl: 'fullNameError', message: 'Please enter your full name (at least 2 characters).' },
      email: { errorEl: 'emailError', message: 'Please enter a valid email address.' },
      password: { errorEl: 'passwordError', message: 'Password must be 8+ characters and include a letter and a number.' },
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault(); // stop native full-page submission — we validate/handle it ourselves

      let firstInvalidField = null;

      // Walk through each tracked field and use the native Constraint Validation API
      for (const [fieldName, config] of Object.entries(fieldConfig)) {
        const field = form.elements[fieldName];
        const errorEl = document.getElementById(config.errorEl);
        const isValid = field.checkValidity(); // uses required/pattern/minlength automatically

        errorEl.textContent = isValid ? '' : config.message;
        errorEl.classList.toggle('visible', !isValid);
        field.setAttribute('aria-invalid', String(!isValid));

        if (!isValid && !firstInvalidField) {
          firstInvalidField = field;
        }
      }

      if (firstInvalidField) {
        // Send keyboard/screen-reader focus straight to the first problem field
        firstInvalidField.focus();
        statusEl.textContent = 'There are errors in the form. Please review the highlighted fields.';
        return;
      }

      // All fields valid — in a real app you'd now call fetch() to submit the data
      statusEl.textContent = 'Account created successfully!';
      form.reset();
    });
  </script>

</body>
</html>
