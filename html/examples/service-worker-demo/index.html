<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal PWA Demo</title>

  <!--
    Linking the web app manifest is one of the 3 requirements for a page
    to be an installable PWA (the other two: a registered service worker,
    and being served over HTTPS — localhost is exempt from the HTTPS rule).
  -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b6cb0" />

  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    button {
      padding: 0.6rem 1.1rem;
      margin: 0.3rem 0.3rem 0.3rem 0;
      border: none;
      border-radius: 6px;
      background: #2b6cb0;
      color: #fff;
      cursor: pointer;
    }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f6f6f9;
      border-radius: 6px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h1>Minimal Installable PWA</h1>
  <p>
    This page registers a service worker that pre-caches this app shell
    (HTML/CSS/JS) so it keeps working even if you go offline. Try it:
    load this page once, then use DevTools → Network → "Offline" and reload.
  </p>

  <button id="registerBtn">Register Service Worker</button>
  <button id="fetchBtn">Fetch Sample Data</button>

  <div class="status" id="status">Status: not registered yet.</div>

  <script src="index.js"></script>
</body>
</html>
